<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Art Pulse – prototype v2</title>
<style>
:root{--bg:#14181c;--s1:#1b2127;--s2:#232b33;--line:#2a323c;--tx:#dde5ec;--mu:#8a9bab;--dim:#5a6878;
  --green:#00e054;--orange:#ff8000;--blue:#40bcf4;--red:#ff5a5f;--r:6px;--ease:cubic-bezier(.23,1,.32,1)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
a{color:var(--blue);text-decoration:none;word-break:break-all}
.mu{color:var(--mu)}.dim{color:var(--dim)}
.fade{animation:fade 150ms var(--ease)}@keyframes fade{from{opacity:0}to{opacity:1}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

header{position:sticky;top:0;z-index:20;background:rgba(20,24,28,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hrow{max-width:1180px;margin:0 auto;display:flex;gap:12px;align-items:center;padding:14px 20px}
.brand{font-size:18px;font-weight:700;white-space:nowrap}.brand b{color:var(--green)}
#q{flex:1;min-width:0;background:var(--s2);border:1px solid transparent;border-radius:10px;padding:12px 14px;outline:none;font-size:16px}
#q:focus{border-color:var(--mu)}
.mode{border:1px solid var(--line);background:transparent;border-radius:999px;padding:8px 14px;font-size:14px;white-space:nowrap;color:var(--mu)}
.mode.nsfw{border-color:var(--red);color:var(--red)}
.sync{width:11px;height:11px;border-radius:50%;background:var(--green);border:0;padding:0;flex:none}
.sync.off{background:var(--orange)}
nav.tabs{max-width:1180px;margin:0 auto;display:flex;gap:8px;padding:0 16px}
nav.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:12px 12px;color:var(--mu);font-weight:600;font-size:16px}
nav.tabs button[data-on]{color:var(--tx);border-color:var(--green)}
nav.tabs .n{font-weight:400;color:var(--dim);font-size:13px;margin-left:4px}
nav.tabs .n.hot{color:var(--orange)}

.wrap{max-width:1180px;margin:0 auto;display:flex;gap:32px;padding:24px 20px 140px}
main{flex:1;min-width:0}
aside#detail{flex:0 0 440px;position:sticky;top:130px;align-self:flex-start;max-height:calc(100vh - 130px);overflow:auto}
aside#detail:empty{display:none}

h3.sec{display:flex;justify-content:space-between;align-items:baseline;margin:36px 0 10px;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--dim);font-weight:600}
h3.sec:first-child{margin-top:4px}
h3.sec button{background:none;border:0;color:var(--mu);font-size:14px;padding:6px 0;letter-spacing:0;text-transform:none}
.row{display:flex;gap:14px;align-items:center;min-height:60px;padding:10px 14px;margin:0 -14px;border-radius:8px;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 64px}
.row:hover{background:var(--s1)}.row.sel{background:var(--s2)}
.row .ic{width:30px;font-size:18px;text-align:center;color:var(--mu);flex:none}
.row .t{flex:1;min-width:0}
.row .t div:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .meta{margin-top:2px;font-size:14px;color:var(--mu);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .r{font-size:14px;color:var(--dim);white-space:nowrap}
.st{font-size:13px;color:var(--green)}
.blur{filter:blur(5px)}
.empty{color:var(--dim);padding:12px 0}

.chips{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.chip{height:34px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--mu);font-size:14px;white-space:nowrap}
.chip:hover{color:var(--tx);border-color:var(--mu)}
.chip[data-on]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.glabel{font-size:12px;color:var(--dim);width:84px;flex:none;text-transform:uppercase;letter-spacing:.06em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.pcard{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:18px;cursor:pointer;text-align:left}
.pcard:hover{border-color:var(--mu)}
.av{width:52px;height:52px;font-size:18px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#0d1014;margin-bottom:8px}
.pcard .nm{font-weight:600;font-size:17px}.pcard .sub{margin-top:4px;font-size:14px;color:var(--mu)}

.back{background:none;border:0;color:var(--mu);padding:8px 0;margin-bottom:12px;font-size:15px}
.ph{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.ph h2{margin:0;font-size:28px}

/* detail */
.det{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:24px}
.det h2{margin:8px 0 12px;font-size:24px;line-height:1.3;word-break:break-word}
.det dl{display:grid;grid-template-columns:96px 1fr;gap:14px 12px;margin:20px 0}
.det dt{color:var(--dim);font-size:14px;padding-top:6px}.det dd{margin:0}
.det pre{white-space:pre-wrap;word-break:break-all;background:var(--bg);border-radius:8px;padding:10px;font-size:13px;color:var(--mu);margin:6px 0}
.btn{border:1px solid var(--line);background:var(--s2);border-radius:8px;padding:10px 16px;min-height:42px;font-size:15px;white-space:nowrap}
.btn.pri{background:var(--green);color:#08170c;border-color:var(--green);font-weight:600}
.btn.warn{color:var(--red)}
.x{float:right;background:none;border:0;color:var(--mu);font-size:26px;line-height:1;width:44px;height:44px;margin:-12px -12px 0 0}

/* inbox */
.ibox{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px}
.ibox .hd{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.tri{background:var(--s1);border:1px solid var(--line);border-radius:16px;padding:28px;max-width:680px}
.tri h2{margin:10px 0;font-size:26px;word-break:break-word}
.tri .acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.tri kbd,.hint kbd{font:11px ui-monospace,Menlo,monospace;background:var(--bg);border:1px solid var(--line);border-radius:3px;padding:0 4px;color:var(--mu)}
.tri input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 14px;width:260px;font-size:15px;outline:none}
.bar{height:6px;background:var(--s2);border-radius:3px;overflow:hidden;margin:10px 0 20px}.bar i{display:block;height:100%;background:var(--green)}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:grid;place-items:center;z-index:50;padding:16px}
.modal>div{background:var(--s1);border:1px solid var(--line);border-radius:12px;padding:20px;width:min(340px,100%);text-align:center}
.pin{font-size:26px;letter-spacing:.5em;text-align:center;width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;outline:none;margin:12px 0}

.addb{background:var(--green);color:#08170c;border:0;border-radius:10px;width:46px;height:46px;font-size:26px;line-height:1;flex:none;font-weight:600}
.fab{display:none}
.amodal>div{width:min(620px,100%);text-align:left}
.amodal textarea,.note{width:100%;min-height:110px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font:inherit;color:inherit;resize:vertical;outline:none}
.amodal textarea:focus,.note:focus{border-color:var(--mu)}
.prev{border-top:1px solid var(--line);padding:12px 0;display:flex;gap:12px;align-items:flex-start}
.prev .dest{font-size:13px;margin-top:4px}
.opts{display:flex;gap:18px;flex-wrap:wrap;margin:12px 0;font-size:15px;color:var(--mu)}
.opts input{width:18px;height:18px;vertical-align:-3px;margin-right:6px}
#state{position:fixed;bottom:8px;left:8px;z-index:60;font:11px/1.4 ui-monospace,Menlo,monospace;background:rgba(0,0,0,.8);color:#9fb;border-radius:6px;padding:4px 8px;max-width:min(440px,92vw);cursor:pointer;white-space:pre-wrap}
#state:not(.open) .body{display:none}

@media (max-width:860px){
  aside#detail{position:fixed;inset:0;max-height:none;background:var(--bg);z-index:40;padding:12px;flex:none}
  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(20,24,28,.96);border-top:1px solid var(--line);justify-content:space-around;padding:0 0 env(safe-area-inset-bottom);z-index:30}
  nav.tabs button{border-bottom:0;border-top:2px solid transparent;padding:14px 6px;font-size:15px;min-height:56px;flex:1}
  nav.tabs button[data-on]{border-color:var(--green)}
  #state{bottom:76px}
  header{backdrop-filter:none;background:var(--bg)}
  .hrow .addb{display:none}
  .fab{display:block;position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:35;width:58px;height:58px;border-radius:50%;font-size:30px;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  .hrow{padding:12px 16px}.wrap{padding:16px 16px 120px}
  .row{min-height:64px}.grid{grid-template-columns:1fr 1fr;gap:10px}
  .ibox .hd>span{display:flex;flex-wrap:wrap;gap:8px;width:100%}
  .brand{display:none}
}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <span class="brand">art<b>·</b>pulse</span>
    <input type="search" id="q" placeholder="Tìm mọi thứ… ( / )" autocomplete="off">
    <button class="addb" data-act="add" title="Thêm (n)">+</button>
    <button class="mode" id="mode"></button>
    <button class="sync" id="sync" title="Bấm để giả lập mất mạng"></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div class="wrap"><main id="main"></main><aside id="detail"></aside></div>
<div id="modal"></div>
<button class="addb fab" data-act="add" aria-label="Thêm">+</button>
<div id="state"></div>

<script src="https://cdn.jsdelivr.net/npm/minisearch@7.1.0/dist/umd/index.min.js"></script>
<script src="../../../../context-art-pulse/raw/data.js"></script>
<script src="parse.js"></script>
<script>
const { fold, key } = AP;
const M = AP.build(RAW);
const ITEMS = M.items, byId = new Map(ITEMS.map((i) => [i.id, i]));
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const IC = { video: '▶', film: '🎬', code: '#', query: '🔎', note: '✎', folder: '📁', site: '🌐' };
const KN = { video: 'Video', film: 'Phim', code: 'Mã', query: 'Tìm sau', note: 'Ghi chú', folder: 'Thư mục', site: 'Site' };
const PIN = '1234', LOCK_MS = 5 * 60 * 1000;

const S = { tab: 'watch', view: { t: 'home' }, q: '', mode: 'sfw', sel: null, status: new Set(), kind: new Set(), tags: new Set(),
  reveal: new Set(), online: true, pending: 0, triage: null, done: 0, lastAct: Date.now() };

/* ---------- visibility ---------- */
const inMode = (it) => S.mode === 'nsfw' || !it.nsfw;
const inLib = (it) => !it.archived && !it.inbox && !it.secret && inMode(it);
const inInbox = (it) => !it.archived && it.inbox && inMode(it);
const lib = () => ITEMS.filter(inLib);
const sortNew = (a, b) => (b.ts || '').localeCompare(a.ts || '') || b.id - a.id;

/* ---------- search (MiniSearch: prefix + fuzzy + field boosts, folded) ---------- */
let MS = null;
function indexAll() {
  if (!window.MiniSearch) return;
  MS = new MiniSearch({ fields: ['title', 'code', 'people', 'tags', 'url', 'collection', 'notes'], storeFields: [],
    processTerm: (t) => fold(t), tokenize: (s) => s.split(/[\s\-_/.,:|()\[\]]+/).filter(Boolean),
    searchOptions: { boost: { code: 3, people: 3, title: 2, tags: 1.5, url: 0.5 }, prefix: true, fuzzy: (t) => (t.length > 4 ? 0.2 : 0), combineWith: 'AND' } });
  MS.addAll(ITEMS.map((i) => ({ id: i.id, title: i.title, code: i.code, people: i.peopleKeys.map((k) => M.people.get(k).name).join(' '), tags: i.tagKeys.map((k) => M.tags.get(k).name).join(' '), url: i.url, collection: i.collection, notes: i.notes.join(' ') })));
}
function search(q) {
  const boost = (it) => (it.status === 'Sẽ xem' || it.status === 'Đang xem' ? 1.3 : 1) * (it.inbox ? 0.6 : 1);
  if (MS) return MS.search(q).map((r) => ({ it: byId.get(r.id), s: r.score * boost(byId.get(r.id)) })).filter((x) => x.it && !x.it.archived && inMode(x.it) && (!x.it.secret || S.reveal.has('vault'))).sort((a, b) => b.s - a.s).map((x) => x.it);
  const ws = fold(q).split(/\s+/); return ITEMS.filter((it) => !it.archived && inMode(it) && ws.every((w) => fold(it.title + ' ' + it.url + ' ' + it.code).includes(w)));
}

/* ---------- pieces ---------- */
const peopleOf = (it) => it.peopleKeys.map((k) => M.people.get(k).name);
const siteName = (it) => (it.siteKey ? M.sites.get(it.siteKey).name : '');
function row(it) {
  const hidden = it.secret && !S.reveal.has(it.id);
  const meta = [peopleOf(it).join(', '), it.code && it.kind !== 'code' ? it.code : '', siteName(it), it.inbox ? '⏳ Hộp thư' : ''].filter(Boolean).join(' · ');
  return `<div class="row ${S.sel === it.id ? 'sel' : ''}" data-item="${it.id}"><span class="ic">${IC[it.kind]}</span>
    <div class="t"><div class="${hidden ? 'blur' : ''}">${esc(it.title)}</div>${meta ? `<div class="meta">${esc(meta)}</div>` : ''}</div>
    <span class="r">${it.status ? `<span class="st">${it.status}</span>` : ''}${it.progress ? ' ' + esc(it.progress.slice(0, 14)) : ''}${it.nsfw && S.mode === 'nsfw' ? ' <span style="color:var(--red)">18+</span>' : ''}</span></div>`;
}
const section = (title, arr, more, limit = 5) => `<h3 class="sec"><span>${title} · ${arr.length}</span>${more && arr.length > limit ? `<button data-go='${JSON.stringify(more)}'>xem hết ›</button>` : ''}</h3>${arr.slice(0, limit).map(row).join('') || '<div class="empty">Trống</div>'}`;
const hue = (s) => [...s].reduce((h, c) => (h * 31 + c.charCodeAt(0)) % 360, 7);
const avatar = (name) => `<div class="av" style="background:hsl(${hue(name)} 55% 62%)">${esc(name.split(' ').map((w) => w[0]).join('').slice(0, 2))}</div>`;

/* ---------- views ---------- */
function vWatchHome() {
  const L = lib().filter((i) => i.type === 'watch');
  return section('Đang xem dở', L.filter((i) => i.status === 'Đang xem'), { t: 'all', status: 'Đang xem' })
    + section('Sẽ xem', L.filter((i) => i.status === 'Sẽ xem').sort(sortNew), { t: 'all', status: 'Sẽ xem' })
    + section('Mới thêm', [...L].sort(sortNew), { t: 'all' })
    + `<h3 class="sec"><span>Tất cả · ${L.length}</span><button data-go='{"t":"all"}'>mở ›</button></h3>`;
}
function vAll() {
  let L = lib().filter((i) => i.type === 'watch');
  const tagCount = new Map(); L.forEach((i) => i.tagKeys.forEach((k) => tagCount.set(k, (tagCount.get(k) || 0) + 1)));
  if (S.status.size) L = L.filter((i) => S.status.has(i.status));
  if (S.kind.size) L = L.filter((i) => S.kind.has(i.kind));
  if (S.tags.size) L = L.filter((i) => [...S.tags].every((k) => i.tagKeys.includes(k)));
  const groups = new Map(); for (const [k, n] of tagCount) { if (n < 2 && !S.tags.has(k)) continue; const t = M.tags.get(k); (groups.get(t.group) || groups.set(t.group, []).get(t.group)).push([k, n]); }
  const open = S.view.open || '';
  const tagRows = ['gu', 'body', 'vùng', 'thể loại', 'khác'].filter((g) => groups.get(g)?.length).map((g) => { const arr = groups.get(g).sort((a, b) => b[1] - a[1]); const lim = open === g ? 99 : 5;
    return `<div class="chips"><span class="glabel">${g}</span>${arr.slice(0, lim).map(([k, n]) => `<button class="chip" data-tag="${k}" ${S.tags.has(k) ? 'data-on' : ''}>${esc(M.tags.get(k).name)} <span class="dim">${n}</span></button>`).join('')}${arr.length > 5 && open !== g ? `<button class="chip" data-open="${g}">+${arr.length - 5}</button>` : ''}</div>`; }).join('');
  const chip = (set, v, label) => `<button class="chip" data-set="${set}" data-v="${v}" ${S[set].has(v) ? 'data-on' : ''}>${label}</button>`;
  return `<button class="back" data-go='{"t":"home"}'>← Xem</button>
    <div class="chips"><span class="glabel">trạng thái</span>${['Sẽ xem', 'Đang xem', 'Đã xem'].map((s) => chip('status', s, s)).join('')}</div>
    <div class="chips"><span class="glabel">loại</span>${['video', 'film', 'code'].map((k) => chip('kind', k, IC[k] + ' ' + KN[k])).join('')}</div>
    ${tagRows}${S.status.size + S.kind.size + S.tags.size ? '<div class="chips"><button class="chip" data-act="clear">✕ Xoá lọc</button></div>' : ''}
    <h3 class="sec"><span>${L.length} mục</span><button data-act="sort">${S.view.az ? 'A–Z' : 'Mới nhất'}</button></h3>
    ${(S.view.az ? [...L].sort((a, b) => a.title.localeCompare(b.title, 'vi')) : [...L].sort(sortNew)).slice(0, 300).map(row).join('')}${L.length > 300 ? '<div class="empty">… gõ tìm để thu hẹp</div>' : ''}`;
}
function vPeople() {
  const ps = [...M.people.values()].map((p) => ({ ...p, vis: p.items.map((id) => byId.get(id)).filter((i) => i && !i.archived && inMode(i)) })).filter((p) => p.vis.length).sort((a, b) => b.vis.length - a.vis.length);
  if (!ps.length) return `<div class="empty">${S.mode === 'sfw' ? 'Chế độ SFW: không có ai. Chuyển 18+ để xem.' : 'Chưa có ai.'}</div>`;
  return `<h3 class="sec"><span>Diễn viên · ${ps.length}</span></h3><div class="grid">${ps.map((p) => { const tags = topTags(p.vis, 2);
    return `<button class="pcard" data-go='${JSON.stringify({ t: 'person', k: p.key })}'>${avatar(p.name)}<div class="nm">${esc(p.name)}</div><div class="sub">${p.vis.length} mục${tags ? ' · ' + esc(tags) : ''}</div></button>`; }).join('')}</div>`;
}
const topTags = (items, n) => { const c = new Map(); items.forEach((i) => i.tagKeys.forEach((k) => c.set(k, (c.get(k) || 0) + 1))); return [...c].sort((a, b) => b[1] - a[1]).slice(0, n).map(([k]) => M.tags.get(k).name).join(', '); };
function vPerson() {
  const p = M.people.get(S.view.k); const its = p.items.map((id) => byId.get(id)).filter((i) => i && !i.archived && inMode(i)).sort(sortNew);
  return `<button class="back" data-go='{"t":"home"}'>← Người</button><div class="ph">${avatar(p.name)}<div><h2>${esc(p.name)}</h2><div class="mu">${its.length} mục · ${esc(topTags(its, 4))}</div></div></div>`
    + ['watch', 'source'].map((ty) => { const a = its.filter((i) => i.type === ty); return a.length ? `<h3 class="sec"><span>${ty === 'watch' ? 'Để xem' : 'Thư mục / site'} · ${a.length}</span></h3>${a.map(row).join('')}` : ''; }).join('');
}
function vSources() {
  const its = ITEMS.filter((i) => i.type === 'source' || (i.siteKey && i.type === 'watch'));
  const agg = new Map();
  for (const i of its) { if (i.archived || !inMode(i) || i.secret || !i.siteKey) continue; const s = M.sites.get(i.siteKey); const a = agg.get(s.key) || { s, n: 0, inbox: 0 }; a.n++; if (i.inbox) a.inbox++; agg.set(s.key, a); }
  const list = (folder) => [...agg.values()].filter((a) => a.s.folder === folder).sort((a, b) => b.n - a.n);
  const r = (a) => `<div class="row" data-go='${JSON.stringify({ t: 'site', k: a.s.key })}'><span class="ic">${a.s.folder ? '📁' : '🌐'}</span><div class="t"><div>${esc(a.s.name)}</div><div class="meta">${esc([...a.s.domains].slice(0, 3).join(', '))}</div></div><span class="r">${a.n} link${a.inbox ? ` · <span style="color:var(--orange)">${a.inbox} chờ</span>` : ''}</span></div>`;
  const vault = ITEMS.filter((i) => i.secret && !i.archived);
  const sites = list(false), folders = list(true);
  return `<h3 class="sec"><span>Thư mục · ${folders.length}</span></h3>${folders.map(r).join('')}
    <h3 class="sec"><span>Site · ${sites.length}</span>${sites.length > 12 && !S.view.allSites ? `<button data-act="allsites">tất cả ›</button>` : ''}</h3>${sites.slice(0, S.view.allSites ? 999 : 12).map(r).join('')}
    ${S.mode === 'nsfw' ? `<h3 class="sec"><span>🔒 Két · ${vault.length}</span><button data-go='{"t":"vault"}'>mở ›</button></h3><div class="dim" style="font-size:14px">Link notepad, mật khẩu, mã… Không bao giờ đăng Discord.</div>` : ''}`;
}
function vSite() {

    ITEMS.forEach((i) => { if (i[prop].includes(s.b)) i[prop] = [...new Set(i[prop].map((k) => (k === s.b ? s.a : k)))]; }); if (s.kind === 'person') Mp.get(s.a).items.push(...Mp.get(s.b).items); Mp.delete(s.b); s.done = true; return change(); }
  if (d.nomerge != null) { M.suggestions[+d.nomerge].done = true; return render(); }
  const a = d.act;
  if (a === 'close') { S.sel = null; return render(); }
  if (a === 'clear') { S.status.clear(); S.kind.clear(); S.tags.clear(); return render(); }
  if (a === 'sort') { S.view = { ...S.view, az: !S.view.az }; return render(); }
  if (a === 'allsites') { S.view = { ...S.view, allSites: true }; return render(); }
  if (a === 'archive') { byId.get(S.sel).archived = true; S.sel = null; return change(); }
  if (a === 'unarchive') { byId.get(S.sel).archived = false; return change(); }
  if (a === 'endtri') { S.triage = null; return render(); }
  if (a === 'add') return openAdd();
  if (a === 'addsave') return saveAdd();
  if (a === 'addclose' || (a === 'addbg' && e.target === t)) { document.getElementById('modal').innerHTML = ''; return; }
  if (a === 'pincancel') { document.getElementById('modal').innerHTML = ''; }
});
document.addEventListener('keydown', (e) => {
  S.lastAct = Date.now();
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName)) { if (e.key === 'Escape') { e.target.blur(); if (e.target.id === 'q') { e.target.value = ''; S.q = ''; render(); } } return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === '/') { e.preventDefault(); document.getElementById('q').focus(); return; }
  if (e.key === 'n') { e.preventDefault(); return openAdd(); }
  if (e.key === 'Escape') { S.sel = null; document.getElementById('modal').innerHTML = ''; return render(); }
  if (S.tab === 'inbox' && S.triage) { const m = { g: 'keep', s: 'later', a: 'archive', ArrowRight: 'skip' }[e.key]; if (m) { e.preventDefault(); triageAct(m); } }
});
